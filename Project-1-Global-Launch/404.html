<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>404 - Page Not Found</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Segoe UI', Arial, sans-serif;
    background: linear-gradient(135deg, #2b6777, #52ab98);
    color: white;
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
  }
  .box h1 {
    font-size: 6em;
    margin-bottom: 10px;
  }
  .box p {
    font-size: 1.3em;
    margin-bottom: 25px;
  }
  .box a {
    background: white;
    color: #2b6777;
    padding: 12px 28px;
    border-radius: 30px;
    text-decoration: none;
    font-weight: bold;
    transition: 0.3s;
  }
  .box a:hover {
    background: #eef6f5;
  }
</style>
</head>
<body>
  <div class="box">
    <h1>404</h1>
    <p>Oops! The page you're looking for doesn't exist.</p>
    <a href="index.html">Go back to Home</a>
  </div>
</body>
</html>
